name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRUST_OPTIONS: -DCRUST_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
  CRUST_C99: -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_EXTENSIONS=OFF
  EMSCRIPTEN_VERSION: 4.0.5
  WASI_SDK_VERSION: 34
  WASMTIME_VERSION: 49.0.2

jobs:
  msvc:
    name: MSVC ${{ matrix.arch }} SIMD=${{ matrix.simd }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32, ARM64]
        simd: [OFF, ON]
        include:
          - arch: x64
            runner: windows-latest
          - arch: Win32
            runner: windows-latest
          - arch: ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }}

      - name: Debug
        run: |
          cmake --build build --config Debug --parallel
          ctest --test-dir build -C Debug --output-on-failure

      - name: Release
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

  clang-cl:
    name: Clang-cl ${{ matrix.arch }} SIMD=${{ matrix.simd }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        simd: [OFF, ON]
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -T ClangCL -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }}

      - name: Debug
        run: |
          cmake --build build --config Debug --parallel
          ctest --test-dir build -C Debug --output-on-failure

      - name: Release
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

  mingw:
    name: MinGW x64 GCC SIMD=${{ matrix.simd }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [OFF, ON]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p cmake:p ninja:p

      - name: Debug
        run: |
          cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  unix:
    name: ${{ matrix.name }} SIMD=${{ matrix.simd }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [Linux GCC, Linux Clang, Linux ARM64 GCC, macOS ARM64 Clang]
        simd: [OFF, ON]
        include:
          - name: Linux GCC
            runner: ubuntu-24.04
            compiler: gcc
            cxx: g++
          - name: Linux Clang
            runner: ubuntu-24.04
            compiler: clang
            cxx: clang++
          - name: Linux ARM64 GCC
            runner: ubuntu-24.04-arm
            compiler: gcc
            cxx: g++
          - name: macOS ARM64 Clang
            runner: macos-latest
            compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Debug
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  linux-x86:
    name: Linux x86 GCC ${{ matrix.math }} SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - math: x87
            simd: OFF
            flags: -m32
          - math: SSE
            simd: OFF
            flags: -m32 -msse2 -mfpmath=sse
          - math: SSE
            simd: ON
            flags: -m32 -msse2 -mfpmath=sse
    steps:
      - uses: actions/checkout@v7

      - name: Install multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Debug
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  emscripten:
    name: Emscripten SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: [OFF, ON]
    steps:
      - uses: actions/checkout@v7

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install $EMSCRIPTEN_VERSION
          "$RUNNER_TEMP/emsdk/emsdk" activate $EMSCRIPTEN_VERSION

      - name: Debug
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  wasm64:
    name: Emscripten wasm64 SIMD=${{ matrix.simd }} (build only)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: [OFF, ON]
    steps:
      - uses: actions/checkout@v7

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install $EMSCRIPTEN_VERSION
          "$RUNNER_TEMP/emsdk/emsdk" activate $EMSCRIPTEN_VERSION

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          for config in Debug Release; do
            emcmake cmake -S . -B build/$config -DCMAKE_BUILD_TYPE=$config -DCMAKE_C_FLAGS=-sMEMORY64=1 -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_EXE_LINKER_FLAGS=-sMEMORY64=1 -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
            cmake --build build/$config --parallel
          done

  sanitizers:
    name: ${{ matrix.sanitizer }} SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASan+UBSan, TSan]
        simd: [OFF, ON]
        include:
          - sanitizer: ASan+UBSan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          - sanitizer: TSan
            flags: -fsanitize=thread -fno-omit-frame-pointer -O1
    steps:
      - uses: actions/checkout@v7

      - name: Allow TSan memory mappings
        if: matrix.sanitizer == 'TSan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Debug
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCRUST_USE_SIMD=${{ matrix.simd }} "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}" ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCRUST_USE_SIMD=${{ matrix.simd }} "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}" ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  arm32:
    name: Linux ARM32 GCC (QEMU) SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: [OFF, ON]
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user

      - name: Debug
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  android:
    name: Android ${{ matrix.abi }} SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            simd: OFF
          - abi: arm64-v8a
            simd: ON
          - abi: armeabi-v7a
            simd: OFF
          - abi: x86_64
            simd: ON
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          for config in Debug Release; do
            cmake -S . -B build/$config -DCMAKE_BUILD_TYPE=$config "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
            cmake --build build/$config --parallel
          done

  wasi:
    name: WASI SIMD=${{ matrix.simd }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: [OFF, ON]
    steps:
      - uses: actions/checkout@v7

      - name: Install WASI SDK and Wasmtime
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASMTIME=$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      - name: Debug
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_TOOLCHAIN_FILE=$WASI_SDK/share/cmake/wasi-sdk-p1.cmake" "-DWASI_SDK_PREFIX=$WASI_SDK" "-DCMAKE_CROSSCOMPILING_EMULATOR=$WASMTIME" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/debug --parallel
          ctest --test-dir build/debug --output-on-failure

      - name: Release
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$WASI_SDK/share/cmake/wasi-sdk-p1.cmake" "-DWASI_SDK_PREFIX=$WASI_SDK" "-DCMAKE_CROSSCOMPILING_EMULATOR=$WASMTIME" -DCRUST_USE_SIMD=${{ matrix.simd }} ${{ env.CRUST_OPTIONS }} ${{ env.CRUST_C99 }}
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

  shared:
    name: Shared library ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            runner: windows-latest
          - name: Linux GCC
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Debug
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON ${{ env.CRUST_OPTIONS }}
          cmake --build build --config Debug --parallel
          ctest --test-dir build -C Debug --output-on-failure

  package:
    name: Installed package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRUST_USE_SIMD=ON
          cmake --build build --parallel
          cmake --install build --prefix "$RUNNER_TEMP/crust"

      - name: Consumer
        run: |
          cmake -S tests/package -B build-package -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crust" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build-package --parallel
          ./build-package/crust_package

  presets:
    name: Preset ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: msvc2022-x64
            build: build-msvc2022-x64-release
            runner: windows-latest
          - preset: linux-gcc-release
            build: build-linux-gcc-release
            runner: ubuntu-24.04
          - preset: linux-clang-release
            build: build-linux-clang-release
            runner: ubuntu-24.04
          - preset: osx-clang-release
            build: build-osx-release
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} ${{ env.CRUST_OPTIONS }}
          cmake --build --preset ${{ matrix.build }}
          ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure
